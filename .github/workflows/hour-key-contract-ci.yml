name: KAI Hour Key contract CI

on:
  push:
    paths:
      - 'work/kai-hour-key-contracts/**'
      - '.github/workflows/hour-key-contract-ci.yml'
  pull_request:
    paths:
      - 'work/kai-hour-key-contracts/**'
      - '.github/workflows/hour-key-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    defaults:
      run:
        working-directory: work/kai-hour-key-contracts
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: work/kai-hour-key-contracts/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run quality gates
        run: |
          mkdir -p evidence/ci
          npm run quality:verify 2>&1 | tee evidence/ci/quality.log

      - name: Run tests and write evidence
        run: npm run ci:verify -- --output-dir evidence/ci

      - name: Upload immutable CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kai-hour-key-ci-evidence-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/kai-hour-key-contracts/evidence/ci/
          if-no-files-found: error
          retention-days: 30
