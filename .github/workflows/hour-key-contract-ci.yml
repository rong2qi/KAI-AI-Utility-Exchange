name: KAI Hour Key contract CI

on:
  push:
    paths:
      - 'work/kai-hour-key-contracts/**'
      - '.github/workflows/hour-key-contract-ci.yml'
  pull_request:
    paths:
      - 'work/kai-hour-key-contracts/**'
      - '.github/workflows/hour-key-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: work/kai-hour-key-contracts
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: work/kai-hour-key-contracts/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run quality gates
        run: |
          mkdir -p evidence/ci
          npm run quality:verify 2>&1 | tee evidence/ci/quality.log

      - name: Run tests and write evidence
        run: npm run ci:verify -- --output-dir evidence/ci

      - name: Verify live smoke remains gated
        run: |
          mkdir -p evidence/upstream-provider-live
          set +e
          npm run xfyun:live:smoke > evidence/upstream-provider-live/guard.log 2>&1
          status=$?
          set -e
          test "$status" -eq 2

      - name: Upload immutable CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kai-hour-key-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/kai-hour-key-contracts/evidence/ci/
            work/kai-hour-key-contracts/evidence/provider-sandbox/
            work/kai-hour-key-contracts/evidence/local-http-sandbox/
            work/kai-hour-key-contracts/evidence/upstream-provider-contract/
            work/kai-hour-key-contracts/evidence/upstream-provider-live/
          if-no-files-found: error
          retention-days: 30
