name: KAI Hour Key staging deploy

on:
  push:
    branches: [main]
    paths:
      - 'work/kai-hour-key-contracts/package.json'
      - 'work/kai-hour-key-contracts/package-lock.json'
      - 'work/kai-hour-key-contracts/src/staging-service.mjs'
      - 'work/kai-hour-key-contracts/scripts/staging-service.mjs'
      - 'work/kai-hour-key-contracts/scripts/staging-bundle.mjs'
      - 'work/kai-hour-key-contracts/ops/staging/**'
      - '.github/workflows/kai-hour-key-staging-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kai-hour-key-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: staging
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use the supported Node range
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/kai-hour-key-contracts/package-lock.json

      - name: Verify the package before creating a release
        working-directory: work/kai-hour-key-contracts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run quality:verify

      - name: Build the immutable runtime bundle
        working-directory: work/kai-hour-key-contracts
        env:
          BUNDLE_PATH: ${{ runner.temp }}/kai-hour-key-staging/staging.tar.gz
        run: |
          set -eu
          mkdir -p "$(dirname "$BUNDLE_PATH")"
          node scripts/staging-bundle.mjs --version "sha-${GITHUB_SHA}" --output "$BUNDLE_PATH"

      - name: Deploy through the protected staging broker
        working-directory: work/kai-hour-key-contracts
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          BUNDLE_PATH: ${{ runner.temp }}/kai-hour-key-staging/staging.tar.gz
          SSH_KEY_PATH: ${{ runner.temp }}/kai-hour-key-staging/deploy_key
          KNOWN_HOSTS_PATH: ${{ runner.temp }}/kai-hour-key-staging/known_hosts
        run: |
          set -eu
          umask 077
          mkdir -p "$(dirname "$BUNDLE_PATH")"
          trap 'rm -f "$SSH_KEY_PATH" "$KNOWN_HOSTS_PATH"' EXIT
          test -n "$STAGING_HOST"
          test -n "$STAGING_DEPLOY_USER"
          test -n "$STAGING_SSH_PRIVATE_KEY"
          test -n "$STAGING_KNOWN_HOSTS"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$SSH_KEY_PATH"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$KNOWN_HOSTS_PATH"
          chmod 600 "$SSH_KEY_PATH" "$KNOWN_HOSTS_PATH"
          BUNDLE_PATH="$BUNDLE_PATH" SSH_KEY_PATH="$SSH_KEY_PATH" KNOWN_HOSTS_PATH="$KNOWN_HOSTS_PATH" \
            STAGING_HOST="$STAGING_HOST" STAGING_DEPLOY_USER="$STAGING_DEPLOY_USER" \
            node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const bundle = readFileSync(process.env.BUNDLE_PATH);
          const digest = createHash('sha256').update(bundle).digest('hex');
          const version = `sha-${process.env.GITHUB_SHA}`;
          const request = JSON.stringify({
            op: 'deploy',
            version,
            digest,
            bundleBase64: bundle.toString('base64'),
          });
          const target = `${process.env.STAGING_DEPLOY_USER}@${process.env.STAGING_HOST}`;
          const common = [
            '-T', '-i', process.env.SSH_KEY_PATH,
            '-o', `UserKnownHostsFile=${process.env.KNOWN_HOSTS_PATH}`,
            '-o', 'StrictHostKeyChecking=yes',
            '-o', 'BatchMode=yes',
            '-o', 'IdentitiesOnly=yes',
            target,
          ];
          const deploy = spawnSync('ssh', common, { input: request, encoding: 'utf8' });
          process.stdout.write(deploy.stdout || '');
          process.stderr.write(deploy.stderr || '');
          if (deploy.status !== 0) process.exit(deploy.status ?? 1);
          const status = spawnSync('ssh', common, { input: JSON.stringify({ op: 'status' }), encoding: 'utf8' });
          process.stdout.write(status.stdout || '');
          process.stderr.write(status.stderr || '');
          if (status.status !== 0) process.exit(status.status ?? 1);
          NODE
