name: KAI Dahono live smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kai-dahono-live
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    environment:
      name: staging
    timeout-minutes: 10
    defaults:
      run:
        working-directory: work/kai-hour-key-contracts
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/kai-hour-key-contracts/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the explicitly confirmed smoke
        env:
          DAHONO_API_KEY: ${{ secrets.DAHONO_API_KEY }}
        run: npm run dahono:live:smoke -- --confirm-live

      - name: Upload redacted live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kai-dahono-live-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/kai-hour-key-contracts/evidence/dahono-provider/
          if-no-files-found: error
          retention-days: 30
